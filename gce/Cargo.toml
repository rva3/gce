[package]
name = "gce"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "asm"
path = "src/asm.rs"

[[bin]]
name = "dis"
path = "src/dis.rs"

[[bin]]
name = "sim"
path = "src/sim.rs"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
bilge = "0.5.0"
clap = { version = "4.6.7", features = ["derive"] }
clap-num = "1.2.0"
num-traits = "0.2.19"
rapidhash = "4.5.1"
strum = { version = "0.28.0", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
